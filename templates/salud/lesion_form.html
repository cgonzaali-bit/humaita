{% extends "salud/_form_base.html" %}
{% block form_fields %}
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Zona del cuerpo <span class="text-red-500">*</span>
        </label>
        {{ form.zona_cuerpo }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Fecha <span class="text-red-500">*</span>
        </label>
        {{ form.fecha_lesion }}
        {% if form.fecha_lesion.errors %}<p class="text-xs text-red-600 mt-1">{{ form.fecha_lesion.errors.0 }}</p>{% endif %}
    </div>
    <div class="md:col-span-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">
            Descripción <span class="text-red-500">*</span>
        </label>
        {{ form.descripcion }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
        {{ form.estado }}
    </div>
    <div class="md:col-span-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Tratamiento</label>
        {{ form.tratamiento }}
    </div>
    <div class="md:col-span-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
        {{ form.observaciones }}
    </div>
</div>
{% endblock %}
