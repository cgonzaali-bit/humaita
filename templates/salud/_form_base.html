{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">{{ titulo }}</h1>
            <p class="text-sm text-gray-500 mt-1">
                Alumno: <strong>{{ alumno.nombre }} {{ alumno.apellido }}</strong>
            </p>
        </div>
        <a href="{% url 'student_detail' alumno.pk %}" class="btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Volver
        </a>
    </div>

    <form method="post" enctype="multipart/form-data"
          class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 space-y-4">
        {% csrf_token %}

        {% if form.non_field_errors %}
        <div class="p-3 bg-red-100 border border-red-200 text-red-800 rounded-lg text-sm">
            {{ form.non_field_errors }}
        </div>
        {% endif %}

        {% block form_fields %}{% endblock %}

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
            <a href="{% url 'student_detail' alumno.pk %}" class="btn-secondary">Cancelar</a>
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-save"></i> Guardar
            </button>
        </div>
    </form>
</div>
{% endblock %}
