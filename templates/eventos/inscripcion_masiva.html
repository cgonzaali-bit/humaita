{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-2">Inscripción masiva</h1>
    <p class="text-sm text-gray-500 mb-6">Evento: <strong>{{ evento.nombre }}</strong></p>

    <form method="post" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Selecciona los alumnos:</label>
            <div class="max-h-96 overflow-y-auto border rounded-lg p-3 bg-gray-50">
                {{ form.alumnos }}
            </div>
        </div>
        <label class="flex items-center gap-2 text-sm mb-4">
            {{ form.eximir_pago }} Eximir del pago (gratis)
        </label>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
            <a href="{% url 'evento_detail' evento.pk %}" class="btn-secondary">Cancelar</a>
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-users"></i> Inscribir seleccionados
            </button>
        </div>
    </form>
</div>
{% endblock %}
