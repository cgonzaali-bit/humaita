{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto text-center py-12">
    <i class="fa-solid fa-triangle-exclamation text-5xl text-red-500 mb-4"></i>
    <h1 class="text-2xl font-bold mb-2">¿Eliminar miembro del staff?</h1>
    <p class="text-gray-600 mb-6">
        Esta acción eliminará permanentemente a
        <strong>{{ staff.get_full_name|default:staff.username }}</strong>.
    </p>
    <form method="post" class="flex justify-center gap-3">
        {% csrf_token %}
        <a href="{% url 'staff_detail' staff.pk %}" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-danger">
            <i class="fa-solid fa-trash"></i> Eliminar definitivamente
        </button>
    </form>
</div>
{% endblock %}
